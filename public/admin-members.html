<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kelola Member — Sagatama Mart</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">

  <!-- Layar login admin -->
  <div id="loginScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm bg-gray-900 border border-yellow-600/30 rounded-xl p-6">
      <h1 class="text-xl font-bold text-yellow-500 mb-1">Admin — Kelola Member</h1>
      <p class="text-sm text-gray-400 mb-4">Sagatama Mart</p>
      <input id="adminSecretInput" type="password" placeholder="Admin Secret"
        class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 mb-3 text-sm focus:outline-none focus:border-yellow-500" />
      <button id="loginBtn"
        class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-semibold rounded-lg py-2 text-sm transition">
        Masuk
      </button>
      <p id="loginError" class="text-red-400 text-xs mt-2 hidden">Secret salah atau gagal terhubung.</p>
    </div>
  </div>

  <!-- Panel admin -->
  <div id="adminPanel" class="hidden max-w-3xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-xl font-bold text-yellow-500">Kelola Member</h1>
      <button id="logoutBtn" class="text-xs text-gray-400 hover:text-gray-200">Keluar</button>
    </div>

    <!-- Form tambah member -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-4 mb-6">
      <h2 class="text-sm font-semibold text-gray-300 mb-3">Tambah Member Baru</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <input id="newUid" type="text" placeholder="UID Pi Network"
          class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm sm:col-span-1" />
        <input id="newUsername" type="text" placeholder="Username (opsional)"
          class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm sm:col-span-1" />
        <button id="addBtn"
          class="bg-yellow-500 hover:bg-yellow-400 text-black font-semibold rounded-lg py-2 text-sm transition sm:col-span-1">
          + Tambah
        </button>
      </div>
      <p class="text-xs text-gray-500 mt-2">
        UID bisa dilihat dari log Vercel (field <code>user_uid</code> atau <code>customerUid</code>) saat user pernah mencoba checkout, atau minta user kirim screenshot profil Pi Browser mereka.
      </p>
    </div>

    <!-- Daftar member -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden">
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
        <h2 class="text-sm font-semibold text-gray-300">Daftar Member</h2>
        <button id="refreshBtn" class="text-xs text-yellow-500 hover:text-yellow-400">Muat ulang</button>
      </div>
      <div id="memberList" class="divide-y divide-gray-800">
        <p class="text-center text-gray-500 text-sm py-6">Memuat...</p>
      </div>
    </div>
  </div>

<script>
  let ADMIN_SECRET = '';

  const loginScreen = document.getElementById('loginScreen');
  const adminPanel = document.getElementById('adminPanel');
  const loginError = document.getElementById('loginError');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const val = document.getElementById('adminSecretInput').value.trim();
    if (!val) return;
    ADMIN_SECRET = val;
    const ok = await loadMembers();
    if (ok) {
      loginScreen.classList.add('hidden');
      adminPanel.classList.remove('hidden');
      sessionStorage.setItem('sgt_admin_secret', ADMIN_SECRET);
    } else {
      loginError.classList.remove('hidden');
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    ADMIN_SECRET = '';
    sessionStorage.removeItem('sgt_admin_secret');
    adminPanel.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  });

  document.getElementById('refreshBtn').addEventListener('click', loadMembers);

  document.getElementById('addBtn').addEventListener('click', async () => {
    const uid = document.getElementById('newUid').value.trim();
    const username = document.getElementById('newUsername').value.trim();
    if (!uid) return alert('UID wajib diisi');

    const res = await fetch('/api/members/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
      body: JSON.stringify({ uid, username, status: 'active' }),
    });

    if (res.ok) {
      document.getElementById('newUid').value = '';
      document.getElementById('newUsername').value = '';
      loadMembers();
    } else {
      alert('Gagal menambah member.');
    }
  });

  async function loadMembers() {
    const listEl = document.getElementById('memberList');
    try {
      const res = await fetch('/api/members/list', {
        headers: { 'x-admin-secret': ADMIN_SECRET },
      });
      if (!res.ok) return false;

      const { members } = await res.json();

      if (!members.length) {
        listEl.innerHTML = '<p class="text-center text-gray-500 text-sm py-6">Belum ada member.</p>';
        return true;
      }

      listEl.innerHTML = members.map(renderMemberRow).join('');

      members.forEach((m) => {
        document.getElementById('block-' + m.uid)?.addEventListener('click', () => updateMember(m.uid, 'block'));
        document.getElementById('unblock-' + m.uid)?.addEventListener('click', () => setActive(m.uid));
        document.getElementById('delete-' + m.uid)?.addEventListener('click', () => updateMember(m.uid, 'delete'));
      });

      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  function renderMemberRow(m) {
    const statusColor = m.status === 'active' ? 'text-green-400' : m.status === 'blocked' ? 'text-red-400' : 'text-yellow-400';
    return `
      <div class="flex items-center justify-between px-4 py-3">
        <div class="min-w-0">
          <p class="text-sm font-medium truncate">${m.username || '(tanpa username)'}</p>
          <p class="text-xs text-gray-500 truncate">${m.uid}</p>
          <p class="text-xs ${statusColor} mt-0.5">${m.status}</p>
        </div>
        <div class="flex gap-2 shrink-0">
          ${m.status === 'active'
            ? `<button id="block-${m.uid}" class="text-xs bg-gray-800 hover:bg-gray-700 rounded-lg px-2 py-1">Blokir</button>`
            : `<button id="unblock-${m.uid}" class="text-xs bg-gray-800 hover:bg-gray-700 rounded-lg px-2 py-1">Aktifkan</button>`}
          <button id="delete-${m.uid}" class="text-xs bg-red-900/50 hover:bg-red-900 text-red-300 rounded-lg px-2 py-1">Hapus</button>
        </div>
      </div>`;
  }

  async function updateMember(uid, mode) {
    if (mode === 'delete' && !confirm('Hapus member ini dari whitelist?')) return;
    await fetch('/api/members/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
      body: JSON.stringify({ uid, mode }),
    });
    loadMembers();
  }

  async function setActive(uid) {
    await fetch('/api/members/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET },
      body: JSON.stringify({ uid, status: 'active' }),
    });
    loadMembers();
  }

  // Auto-login kalau secret masih tersimpan di sesi ini
  window.addEventListener('DOMContentLoaded', async () => {
    const saved = sessionStorage.getItem('sgt_admin_secret');
    if (saved) {
      ADMIN_SECRET = saved;
      const ok = await loadMembers();
      if (ok) {
        loginScreen.classList.add('hidden');
        adminPanel.classList.remove('hidden');
      }
    }
  });
</script>
</body>
</html>
